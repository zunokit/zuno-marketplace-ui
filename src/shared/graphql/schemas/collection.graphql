# Collection Queries & Mutations

mutation CreateCollection($input: CreateCollectionInput!) {
  createCollection(input: $input) {
    id
    slug
    userId
    name
    symbol
    description
    category
    contractAddress
    chainId
    tokenStandard
    deployerAddress
    deployedBlock
    status
    deployedAt
    indexStatus
    isVerified
    isHidden
    source
    imageUrl
    bannerUrl
    featuredImageUrl
    websiteUrl
    baseUri
    maxSupply
    mintPriceAllowlist
    mintPricePublic
    mintStartTime
    allowlistStageEnd
    mintLimitPerWallet
    royaltyFeeBps
    royaltyRecipient
    totalSupply
    totalMinted
    metadataStandard
    createdAt
    updatedAt
    metadata {
      id
      collectionId
      metadataUri
      ipfsHash
      ipfsUrl
      discordUrl
      twitterUrl
      instagramUrl
      mediumUrl
      telegramUrl
      backgroundColor
    }
    stats {
      collectionId
      totalItems
      totalOwners
      totalSales
      floorPriceWei
      totalVolumeWei
      averagePriceWei
      volume24hWei
      sales24h
      lastSaleAt
      lastMintAt
      updatedAt
    }
  }
}

