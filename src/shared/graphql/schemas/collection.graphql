# Enums matching backend
enum TokenStandard {
  ERC721
  ERC1155
}

enum CollectionStatus {
  PENDING
  DEPLOYED
  FAILED
  ARCHIVED
}

enum IndexStatus {
  NOT_INDEXED
  INDEXING
  INDEXED
  FAILED
}

# Types
type Collection {
  id: ID!
  userId: ID!
  name: String!
  symbol: String!
  slug: String
  description: String
  contractAddress: String
  chainId: String!
  tokenStandard: TokenStandard!
  status: CollectionStatus!
  indexStatus: IndexStatus!
  creatorAddress: String!
  deployerAddress: String!

  # Images
  imageUrl: String!
  bannerImageUrl: String
  featuredImageUrl: String

  # Mint settings
  baseUri: String
  maxSupply: Int
  mintPrice: String
  mintPriceAllowlist: String
  mintPricePublic: String
  mintStartTime: String
  allowlistStageEnd: String

  # Royalty
  royaltyFeeBps: Int
  royaltyRecipient: String

  # Relations
  metadata: CollectionMetadata
  stats: CollectionStats

  # Timestamps
  createdAt: String!
  updatedAt: String!
  deployedAt: String
}

type CollectionMetadata {
  websiteUrl: String
  discordUrl: String
  twitterUrl: String
  instagramUrl: String
  mediumUrl: String
  telegramUrl: String
  ipfsHash: String
  ipfsUrl: String
}

type CollectionStats {
  totalItems: Int!
  totalOwners: Int!
  totalVolume: String!
  floorPrice: String!
  totalSales: Int!
  averagePrice: String
  lastSaleAt: String
}

type CollectionConnection {
  items: [Collection!]!
  pageInfo: PageInfo!
}

type PageInfo {
  page: Int!
  limit: Int!
  total: Int!
  totalPages: Int!
  hasNext: Boolean!
  hasPrev: Boolean!
}

# Inputs - mapped from MintTerminalCreateForm
input CreateCollectionInput {
  # Required
  name: String!
  symbol: String!
  tokenStandard: TokenStandard!
  chainId: String!
  deployerAddress: String!
  imageUrl: String!

  # Optional
  description: String
  bannerImageUrl: String
  featuredImageUrl: String

  # Mint settings
  baseUri: String
  maxSupply: Int
  mintPrice: String
  mintPriceAllowlist: String
  mintPricePublic: String
  mintStartTime: String
  allowlistStageDurationSeconds: Int
  mintLimitPerWallet: Int

  # Royalty
  royaltyFeeBps: Int
  royaltyRecipient: String

  # Metadata links
  websiteUrl: String
  discordUrl: String
  twitterUrl: String
}

input UpdateCollectionInput {
  contractAddress: String
  status: CollectionStatus
  deployedAt: String
  description: String
  bannerImageUrl: String
  websiteUrl: String
  discordUrl: String
  twitterUrl: String
}

input AddToAllowlistInput {
  collectionId: ID!
  walletAddresses: [String!]!
  maxMintAmount: Int
}

# Queries
extend type Query {
  collection(id: ID, slug: String, contractAddress: String, chainId: String): Collection
  myCollections(page: Int, limit: Int): CollectionConnection!
  collections(
    page: Int
    limit: Int
    sortBy: String
    sortOrder: String
    category: String
    chainId: String
    isVerified: Boolean
    searchQuery: String
  ): CollectionConnection!
}

# Mutations
extend type Mutation {
  createCollection(input: CreateCollectionInput!): Collection!
  updateCollection(id: ID!, input: UpdateCollectionInput!): Collection!
  addToAllowlist(input: AddToAllowlistInput!): Boolean!
  deleteCollection(id: ID!): Boolean!
}
