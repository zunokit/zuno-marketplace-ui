}

query GetCollections(
  $page: Int
  $limit: Int
  $sortBy: CollectionSortField
  $sortOrder: SortOrder
  $category: String
  $chainId: String
  $isVerified: Boolean
  $searchQuery: String
) {
  collections(
    page: $page
    limit: $limit
    sortBy: $sortBy
    sortOrder: $sortOrder
    category: $category
    chainId: $chainId
    isVerified: $isVerified
    searchQuery: $searchQuery
  ) {
    items {
      id
      slug
      userId
      name
      symbol
      description
      category
      contractAddress
      chainId
      tokenStandard
      deployerAddress
      deployedBlock
      status
      deployedAt
      indexStatus
      isVerified
      isHidden
      source
      imageUrl
      bannerUrl
      featuredImageUrl
      websiteUrl
      baseUri
      maxSupply
      mintPriceAllowlist
      mintPricePublic
      mintStartTime
      allowlistStageEnd
      mintLimitPerWallet
      royaltyFeeBps
      royaltyRecipient
      totalSupply
      totalMinted
      metadataStandard
      createdAt
      updatedAt
    }
    pageInfo {
      totalCount
      page
      limit
      hasNext
      hasPrevious
    }
  }
}
